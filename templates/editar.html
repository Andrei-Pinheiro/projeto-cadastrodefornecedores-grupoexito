<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Dados</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Editar Dados</h2>

    {% if mensagem %}
        <div class="alert alert-success">
            {{ mensagem }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                value="{{ fornecedor['email'] }}"
            >
        </div>

        <div class="mb-3">
            <label>Telefone</label>
            <input
                type="text"
                name="telefone"
                class="form-control"
                value="{{ fornecedor['telefone'] }}"
            >
        </div>

        <div class="mb-3">
            <label>Endereço</label>
            <input
                type="text"
                name="endereco"
                class="form-control"
                value="{{ fornecedor['endereco'] }}"
            >
        </div>

        <div class="mb-3">
            <label>Cidade</label>
            <input
                type="text"
                name="cidade"
                class="form-control"
                value="{{ fornecedor['cidade'] }}"
            >
        </div>

        <div class="mb-3">
            <label>UF</label>
            <input
                type="text"
                name="uf"
                class="form-control"
                value="{{ fornecedor['uf'] }}"
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Salvar Alterações
        </button>

        <a href="/dashboard" class="btn btn-secondary">
            Voltar
        </a>

    </form>

</div>

</body>
</html>
